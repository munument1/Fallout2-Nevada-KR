name: Translation sources and package validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile==2023.2.7
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_translation.py --output dist/korean-classic-data.zip
      - uses: actions/upload-artifact@v4
        with:
          name: korean-classic-data
          path: dist/korean-classic-data.zip
          if-no-files-found: error
